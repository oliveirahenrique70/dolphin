<svg viewBox="0 0 200 160" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="computerTitle">
  <title id="computerTitle">Computador laptop estilizado</title>
  <defs>
    <linearGradient id="screenLight" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#22d3ee" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#22d3ee" stop-opacity="0.12"/>
    </linearGradient>
  </defs>

  <!-- Laptop base -->
  <path d="M20,120 L180,120 L195,145 L5,145 Z" fill="#0c222a" stroke="#1f4048" stroke-width="3"/>

  <!-- Laptop screen -->
  <rect x="35" y="25" width="130" height="100" rx="10" fill="#081920" stroke="#1c4750" stroke-width="3"/>

  <!-- Screen glow -->
  <rect x="44" y="36" width="112" height="78" rx="6" fill="url(#screenLight)"/>

  <!-- Code lines -->
  <rect x="55" y="52" width="50" height="7" rx="3.5" fill="#67e8f9" opacity="0.95"/>
  <rect x="55" y="70" width="80" height="7" rx="3.5" fill="#22d3ee" opacity="0.75"/>
  <rect x="55" y="88" width="60" height="7" rx="3.5" fill="#67e8f9" opacity="0.6"/>

  <!-- Blinking cursor -->
  <rect x="120" y="88" width="5" height="7" rx="1" fill="#67e8f9">
    <animate attributeName="opacity" values="1;0;1" dur="1.1s" repeatCount="indefinite"/>
  </rect>
</svg>